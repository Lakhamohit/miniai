<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniAI v1.0</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f1f3f5;
    margin:0;
    padding:20px;
}

#chat-container{
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

#chat-box{
    height:450px;
    overflow-y:auto;
    border:1px solid #ddd;
    padding:10px;
    background:#fafafa;
}

.message{
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    white-space:pre-wrap;
}

.user{
    background:#007bff;
    color:white;
    margin-left:20%;
}

.ai{
    background:#e9ecef;
    margin-right:20%;
}

#input-area{
    display:flex;
    gap:10px;
    margin-top:10px;
}

input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    border:none;
    background:#007bff;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div id="chat-container">

<h2>🤖 MiniAI</h2>

<div id="chat-box"></div>

<div id="input-area">

<input
id="user-input"
placeholder="Ask MiniAI anything..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const chatBox=document.getElementById("chat-box");
const input=document.getElementById("user-input");

function addMessage(text,type){

let div=document.createElement("div");

div.className="message "+type;

div.innerText=text;

chatBox.appendChild(div);

chatBox.scrollTop=chatBox.scrollHeight;

}

async function searchWikipedia(query){

try{

const url=
"https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="
+
encodeURIComponent(query)
+
"&utf8=&format=json&origin=*";

const response=await fetch(url);

const data=await response.json();

if(!data.query.search.length){

return null;

}

const page=data.query.search[0];

const snippet=page.snippet
.replace(/<[^>]+>/g,"");

return page.title+"\n\n"+snippet+"...";

}

catch(error){

console.error(error);

return null;

}

}

async function think(question){

addMessage("Thinking...","ai");

let answer=await searchWikipedia(question);

document.querySelector(".ai:last-child").remove();

if(answer){

return answer;

}

return "Sorry, I couldn't find anything.";

}

async function sendMessage(){

let question=input.value.trim();

if(question==="") return;

addMessage(question,"user");

input.value="";

let reply=await think(question);

addMessage(reply,"ai");

}

input.addEventListener("keydown",function(e){

if(e.key==="Enter"){

sendMessage();

}

});

addMessage(
"Hello! I'm MiniAI. Ask me anything.",
"ai"
);

</script>

</body>
</html>
